name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Verificar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Resolver Chrome del runner
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            unset PUPPETEER_SKIP_DOWNLOAD
            npx puppeteer browsers install chrome
            CHROME="$(node -e "console.log(require('puppeteer').executablePath())")"
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Validar sintaxis
        run: npm run check

      - name: Ejecutar pruebas
        run: npm test

      - name: Publicar lockfile validado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-generated
          path: package-lock.json
          if-no-files-found: error
