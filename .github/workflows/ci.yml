name: CI

on:
  push:
    branches:
      - main
      - audit/cleanup-dashboard-20260826
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias y sincronizar lockfile
        run: npm install

      - name: Validar sintaxis
        run: npm run check

      - name: Ejecutar pruebas
        run: npm test

      - name: Publicar lockfile generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-generated
          path: package-lock.json
          if-no-files-found: ignore
