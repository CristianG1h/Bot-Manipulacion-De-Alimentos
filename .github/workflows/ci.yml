name: CI

on:
  push:
    branches:
      - main
      - audit/cleanup-dashboard-20260826
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Guardar package-lock sincronizado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json ya está sincronizado"
          else
            git commit -m "chore: sincronizar package-lock"
            git push
          fi

      - name: Instalar dependencias desde lockfile
        run: npm ci --ignore-scripts

      - name: Verificar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Resolver Chrome del runner
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            unset PUPPETEER_SKIP_DOWNLOAD
            npx puppeteer browsers install chrome
            CHROME="$(node -e "console.log(require('puppeteer').executablePath())")"
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Validar sintaxis
        run: npm run check

      - name: Ejecutar pruebas
        run: npm test

      - name: Publicar lockfile validado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-generated
          path: package-lock.json
          if-no-files-found: error
