name: Sync audit lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

# Temporary workflow used only to commit the regenerated lockfile to the audit branch.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/cleanup-dashboard-20260826
          fetch-depth: 0

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package-lock to audit branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
          else
            git commit -m "chore: sincronizar package-lock para Puppeteer 25"
            git push origin HEAD:audit/cleanup-dashboard-20260826
          fi
