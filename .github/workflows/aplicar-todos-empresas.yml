name: Aplicar soporte TODOS empresas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aplicar-todos-empresas.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Activar palabra TODOS en backend y pruebas
        shell: python
        run: |
          from pathlib import Path

          ruta = Path("src/routes/adminCertificados.js")
          texto = ruta.read_text(encoding="utf-8")

          if "const todasLasEmpresas = empresasSolicitadas.some" not in texto:
              ancla = '''  const filtroFacturado = obtenerFiltroFacturado(query.facturado);\n  const rango = obtenerRangoFecha(query);\n\n  if (!empresasSolicitadas.length) return [];'''
              reemplazo = '''  const filtroFacturado = obtenerFiltroFacturado(query.facturado);\n  const rango = obtenerRangoFecha(query);\n  const todasLasEmpresas = empresasSolicitadas.some((empresa) =>\n    ["todos", "todas", "all"].includes(empresa)\n  );\n\n  if (!empresasSolicitadas.length) return [];'''
              if ancla not in texto:
                  raise SystemExit("No se encontró el ancla de filtros")
              texto = texto.replace(ancla, reemplazo, 1)

              ancla_empresa = '''    const empresa = normalizarTexto(usuario.empresa);\n    const coincideEmpresa = empresasSolicitadas.some((busqueda) =>\n      empresa.includes(busqueda)\n    );'''
              reemplazo_empresa = '''    const empresa = normalizarTexto(usuario.empresa);\n    const coincideEmpresa = todasLasEmpresas\n      ? Boolean(empresa)\n      : empresasSolicitadas.some((busqueda) => empresa.includes(busqueda));'''
              if ancla_empresa not in texto:
                  raise SystemExit("No se encontró el bloque de coincidencia de empresa")
              texto = texto.replace(ancla_empresa, reemplazo_empresa, 1)
              ruta.write_text(texto, encoding="utf-8")

          pruebas = Path("tests/admin-facturacion.test.js")
          contenido = pruebas.read_text(encoding="utf-8")
          marcador = 'test("TODOS consulta todas las empresas y conserva los filtros", () => {'

          if marcador not in contenido:
              contenido += '''\n\ntest("TODOS consulta todas las empresas y conserva los filtros", () => {\n  const users = extraerUsuariosDesdeHtml(htmlPanelActual);\n\n  const todos = filtrarUsuarios(users, {\n    q: "TODOS",\n    facturado: "all",\n    range: "all",\n  });\n\n  assert.deepEqual(\n    todos.map((u) => u.documento),\n    ["100000001", "100000002", "100000003"]\n  );\n\n  const noFacturados = filtrarUsuarios(users, {\n    q: "TODOS",\n    facturado: "no",\n    range: "all",\n  });\n\n  assert.deepEqual(\n    noFacturados.map((u) => u.documento),\n    ["100000001", "100000002"]\n  );\n});\n'''
              pruebas.write_text(contenido, encoding="utf-8")

      - name: Instalar dependencias
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --ignore-scripts

      - name: Validar sintaxis y prueba de facturación
        run: |
          node --check src/routes/adminCertificados.js
          node --check src/public/js/dashboard-facturacion-metricas.js
          node --test tests/admin-facturacion.test.js

      - name: Commit final y retirar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aplicar-todos-empresas.yml
          git add src/routes/adminCertificados.js tests/admin-facturacion.test.js
          git commit -m "feat: permitir consultar todas las empresas con TODOS"
          git pull --rebase origin main
          git push origin main
